<!DOCTYPE html>

<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <title>Free E-Book | Start Your Own Blog</title>

<body>

    <!-- Nav -->
    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.png" alt="logo" width="225">

            <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="collapse"
                data-bs-target="#collapsibleNavId" aria-controls="collapsibleNavId" aria-expanded="false"

                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="collapsibleNavId">
                <ul class="navbar-nav ms-auto mt-2 mt-lg-0">
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">

                    </li>
                    <li class="nav-item mt-4 mt-lg-0">
                        <a class="nav-link btn btn-outline-light fw-semibold
            px-4 mx-4" href="contact.html">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <header id="hero-section">
        <div class="container p-7">
            <div class="row">
                <div class="col">
                    <h1 class="text-white">Contact Information</h1>
                </div>
            </div>
        </div>
        <!-- SVG -->
        <svg class="frame-decoration" data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"
            viewBox="0 0 1920 192.275">
            <defs>
                <style>
                    .cls-1 {
                        fill: #f3f6f9;
                    }
                </style>
            </defs>
            <title>frame-decoration</title>
            <path class="cls-1"

    <!-- Contact Form -->
    <section class="bg-light">
        <div class="container">
            <div class="row">
                <div class="col">
                    <form action="https://formspree.io/f/mzdnoegv" method="POST">
                        <div class="mb-3">
                            <input type="text" name="text" class="form-control form-control-lg" placeholder="Name" required />
                        </div>
                        <div class="mb-3">
                            <input type="email" name="email" class="form-control form-control-lg" placeholder="Email Address"
                                required />
                        </div>
                        <div class="mb-3">
                            <textarea name="Message" class="form-control form-control-lg" rows="6" placeholder="Message"></textarea>
                        </div>
                        <div class="mt-4 mb-5 d-grid">
                            <button type="submit" class="btn btn-primary text-white" href="Submition.html" role="button">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Social -->
    <Section class="Social bg-dark p-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6 offset-md-3 text-center">
                    <h5 class="text-bg-dark fs-4 lh-lg">
                        Stay connected and join our vibrant community. For any inquiries or assistance, feel free to
                        reach out tous
                    </h5>
                    <div class="icons text-white d-flex justify-content-center gap-4 mt-4 mb-5">
                        <i class="fab fa-facebook fa-4x"></i>
                        <i class="fab fa-twitter fa-4x"></i>
                        <i class="fab fa-instagram fa-4x"></i>
                        <i class="fab fa-linkedin fa-4x"></i>
                        <i class="fab fa-pinterest fa-4x"></i>

                </div>

                    <a href="#hero-section" class="text-white text-decoration-none">Home</a>
                    <a href="#Details" class="text-white text-decoration-none">Details</a>
                    <a href="contact.html" class="text-white text-decoration-none">Contact</a>

                <div class="col-sm-12 col-md-4 mt-3 mt-md-0 d-md-flex justify-content-md-end">
                    <p class="text-white">Copyright &copy; Blog Mastery 2027</p>
